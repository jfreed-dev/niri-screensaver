name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck (bash scripts)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v6
      - name: Run shellcheck
        run: |
          shellcheck -x \
            bin/niri-screensaver \
            bin/niri-screensaver-launch \
            bin/niri-screensaver-ctl \
            install.sh \
            scripts/check-doc-links.sh \
            scripts/json-validate.sh

  json-validate:
    name: json validate (manifest, i18n)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v6
      - name: Validate JSON files
        run: bash scripts/json-validate.sh

  doc-links:
    name: doc links (markdown + inline path mentions)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v6
      - name: Check relative paths in docs resolve in-tree
        run: bash scripts/check-doc-links.sh

  typos:
    name: typos (spell check)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v6
      - uses: crate-ci/typos@v1.47.0

  markdownlint:
    name: markdownlint (md hygiene)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          config: .markdownlint-cli2.jsonc

  actionlint:
    name: actionlint (workflow hygiene)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v6
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
        shell: bash
      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash
