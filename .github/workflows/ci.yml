name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck (bash scripts)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: |
          shellcheck -x \
            bin/niri-screensaver \
            bin/niri-screensaver-launch \
            bin/niri-screensaver-ctl \
            install.sh \
            scripts/check-doc-links.sh \
            scripts/json-validate.sh

  json-validate:
    name: json validate (manifest, i18n)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
      - name: Validate JSON files
        run: bash scripts/json-validate.sh

  doc-links:
    name: doc links (markdown + inline path mentions)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
      - name: Check relative paths in docs resolve in-tree
        run: bash scripts/check-doc-links.sh

  typos:
    name: typos (spell check)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.47.2

  markdownlint:
    name: markdownlint (md hygiene)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          config: .markdownlint-cli2.jsonc

  actionlint:
    name: actionlint (workflow hygiene)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
        shell: bash
      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

  # Unit-test the bash with bats and measure line coverage with kcov, then
  # upload to Codecov. Runs on a GitHub-hosted runner (not self-hosted) so the
  # bats+kcov toolchain comes from apt rather than being a runner prerequisite.
  # Pinned to 22.04: kcov was dropped from the 24.04 (noble) archive. The tests
  # manage their own temp dirs, so jammy's older bats (1.2.1) is fine.
  coverage:
    name: coverage (bats + kcov)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install bats + kcov
        run: sudo apt-get update && sudo apt-get install -y bats kcov
      - name: Run bats under kcov
        run: |
          mkdir -p coverage
          kcov --clean \
            --include-path="${GITHUB_WORKSPACE}/bin,${GITHUB_WORKSPACE}/scripts" \
            "${GITHUB_WORKSPACE}/coverage" \
            bats test/
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          fail_ci_if_error: false
          verbose: true
